<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Morocco</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 30% 20%, #eef3ff 0%, #dfe7f7 45%, #cdd8ef 100%);
      overflow: hidden;
    }

    .card {
      text-align: center;
      padding: 48px 64px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(60, 90, 150, 0.18);
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #3b6bff, #9b4dff, #ff4d94, #3b6bff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite, fadeUp 1s ease both;
    }

    .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.5s ease-in-out infinite;
    }

    p {
      margin-top: 16px;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: #5a6b8c;
      opacity: 0;
      animation: fadeUp 1s ease 0.4s both;
    }

    .dots { margin-top: 22px; display: flex; justify-content: center; gap: 10px; }

    .dots span {
      width: 12px; height: 12px; border-radius: 50%;
      background: #3b6bff;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(2) { background: #9b4dff; animation-delay: .2s; }
    .dots span:nth-child(3) { background: #ff4d94; animation-delay: .4s; }

    @keyframes shimmer {
      to { background-position: 300% 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(16deg); }
      20% { transform: rotate(-8deg); }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .6; }
      40% { transform: translateY(-12px); opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello Morocco! <span class="wave">👋</span></h1>
    <p>Pushed straight to the <strong>main</strong> branch.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
